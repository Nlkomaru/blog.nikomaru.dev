name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-production' || format('deploy-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - run: pnpm run check:ci

      - run: pnpm run build

      - run: pnpm run typecheck

      - if: github.event_name == 'push'
        name: Load Production Secrets
        uses: nlkomaru/secret-manager@v2
        with:
          project: "blog.nikomaru.dev"
          env: "production"
          shared-keys: |
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN

      - if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          trap 'rm -f .secrets.vars' EXIT
          cat << EOF > .secrets.vars
          HAGAKI_GITHUB_TOKEN=${HAGAKI_GITHUB_TOKEN}
          AUTH_SECRET=${AUTH_SECRET}
          AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
          AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
          GITHUB_CLIENT_ID=${AUTH_GITHUB_ID}
          GITHUB_CLIENT_SECRET=${AUTH_GITHUB_SECRET}
          EOF
          pnpm exec cf deploy --prebuilt --secrets-file .secrets.vars
